[project]
name = "franka-deploy"
version = "0.1.0"
description = "Web bridge between an arbitrary policy server (VLA/RL, user-specified IP) and a Franka FR3."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pyyaml",
    "requests",
    "fastapi",
    "uvicorn[standard]",
    "pyrealsense2",
    "pyzmq",
]

[project.optional-dependencies]
dev = ["pytest"]

# pylibfranka is NOT a pip dependency -- it's a source-built package already
# present at ~/pylibfranka-venv (see franka-policy-runner's README for the
# build). Run this project from that same venv:
#   source ~/pylibfranka-venv/bin/activate
#   pip install -e .
#   uvicorn franka_deploy.api.main:app --host 0.0.0.0 --port 8000

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["franka_deploy*"]

[tool.setuptools.package-data]
franka_deploy = ["static/*", "configs/examples/*.yaml", "kinematics/*.npy"]
